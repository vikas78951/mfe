name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gate
        run: pnpm exec turbo run lint check-types test build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mfe-build
          path: |
            apps/shell/dist
            apps/accounts/dist

  docker:
    name: Build and Push Images
    needs: validate
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build applications
        run: pnpm exec turbo run build

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Shell
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/shell.Dockerfile
          push: true
          tags: |
            ghcr.io/vikas78951/mfe-shell:${{ github.sha }}

      - name: Build and push Accounts
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/accounts.Dockerfile
          push: true
          tags: |
            ghcr.io/vikas78951/mfe-accounts:${{ github.sha }}
