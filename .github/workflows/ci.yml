name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo run lint check-types test build

      - uses: actions/upload-artifact@v7
        with:
          name: mfe-build
          path: |
            apps/shell/dist
            apps/accounts/dist

  docker:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Shell
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/shell.Dockerfile
          push: true
          tags: |
            ghcr.io/vikas78951/mfe-shell:${{ github.sha }}

      - name: Build and push Accounts
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/accounts.Dockerfile
          push: true
          tags: |
            ghcr.io/vikas78951/mfe-accounts:${{ github.sha }}
