name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]

permissions:
  contents: read
  packages: read

jobs:
  deploy-development:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable images
        run: |
          docker pull ghcr.io/vikas78951/mfe-shell:${{ github.event.workflow_run.head_sha }}
          docker pull ghcr.io/vikas78951/mfe-accounts:${{ github.event.workflow_run.head_sha }}

      - name: Deploy development
        run: |
          echo "Deploying SHA: ${{ github.event.workflow_run.head_sha }}"
          echo "Environment: development"

  deploy-staging:
    needs: deploy-development
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact promoted images
        run: |
          docker pull ghcr.io/vikas78951/mfe-shell:${{ github.event.workflow_run.head_sha }}
          docker pull ghcr.io/vikas78951/mfe-accounts:${{ github.event.workflow_run.head_sha }}

      - name: Deploy staging
        run: |
          echo "Deploying SHA: ${{ github.event.workflow_run.head_sha }}"
          echo "Environment: staging"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact promoted images
        run: |
          docker pull ghcr.io/vikas78951/mfe-shell:${{ github.event.workflow_run.head_sha }}
          docker pull ghcr.io/vikas78951/mfe-accounts:${{ github.event.workflow_run.head_sha }}

      - name: Deploy production
        run: |
          echo "Deploying SHA: ${{ github.event.workflow_run.head_sha }}"
          echo "Environment: production"
