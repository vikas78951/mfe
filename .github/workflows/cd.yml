name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - develop

permissions:
  contents: read
  packages: read

jobs:
  development:
    name: Deploy Development
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: development

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable images
        run: |
          docker pull ghcr.io/vikas78951/mfe-shell:${{ github.event.workflow_run.head_sha }}
          docker pull ghcr.io/vikas78951/mfe-accounts:${{ github.event.workflow_run.head_sha }}

      - name: Verify images
        run: |
          docker image inspect \
            ghcr.io/vikas78951/mfe-shell:${{ github.event.workflow_run.head_sha }}

          docker image inspect \
            ghcr.io/vikas78951/mfe-accounts:${{ github.event.workflow_run.head_sha }}

      - name: Deploy
        run: |
          echo "Development deployment"
          echo "SHA: ${{ github.event.workflow_run.head_sha }}"

  staging:
    name: Deploy Staging
    needs: development
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact same images
        run: |
          docker pull ghcr.io/vikas78951/mfe-shell:${{ github.event.workflow_run.head_sha }}
          docker pull ghcr.io/vikas78951/mfe-accounts:${{ github.event.workflow_run.head_sha }}

      - name: Deploy
        run: |
          echo "Staging deployment"
          echo "SHA: ${{ github.event.workflow_run.head_sha }}"

  production:
    name: Deploy Production
    needs: staging
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact same images
        run: |
          docker pull ghcr.io/vikas78951/mfe-shell:${{ github.event.workflow_run.head_sha }}
          docker pull ghcr.io/vikas78951/mfe-accounts:${{ github.event.workflow_run.head_sha }}

      - name: Deploy
        run: |
          echo "Production deployment"
          echo "SHA: ${{ github.event.workflow_run.head_sha }}"
